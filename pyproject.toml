[project]
name = "hsm-sync"
version = "0.1.5"
requires-python = ">=3.11"
dependencies = ["python-dotenv>=1.0", "paramiko>=3.0"]

[project.scripts]
hsm-sync = "hsm_sync.main:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pyinstaller>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hsm_sync"]

[tool.ruff]
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
